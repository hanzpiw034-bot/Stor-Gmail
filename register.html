<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Stor Gmail</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230B5FFF' width='100' height='100' rx='20'/><text x='50' y='70' font-size='60' font-weight='bold' text-anchor='middle' fill='white'>G</text></svg>">
</head>
<body class="light-mode">
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <p class="loading-text">Loading...</p>
    </div>
  </div>

  <!-- Register Container -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">📝</div>
        <h1 class="auth-title">Daftar</h1>
        <p class="auth-subtitle">Buat akun Stor Gmail baru</p>
      </div>

      <form class="auth-form" id="registerForm">
        <!-- Username -->
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Nama pengguna Anda" required>
          <div class="form-error"></div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@gmail.com" required>
          <div class="form-error"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-group">
            <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" required>
            <button type="button" class="toggle-password" id="togglePassword">👁️</button>
          </div>
          <div class="form-error"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password</label>
          <div class="password-group">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Ulangi password" required>
            <button type="button" class="toggle-password" id="toggleConfirmPassword">👁️</button>
          </div>
          <div class="form-error"></div>
        </div>

        <!-- Terms -->
        <div class="remember-me">
          <input type="checkbox" id="terms" name="terms" class="checkbox-custom" required>
          <label for="terms" style="margin: 0; font-size: 0.9rem;">Saya setuju dengan Syarat & Ketentuan</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-button" id="registerBtn">
          <span id="registerBtnText">Daftar</span>
          <span id="registerBtnSpinner" style="display: none;" class="spinner-small"></span>
        </button>

        <!-- Divider -->
        <div class="divider">Atau</div>

        <!-- Google Register -->
        <button type="button" class="auth-button" id="googleRegisterBtn" style="background: linear-gradient(135deg, #EA4335 0%, #c5221f 100%);">
          Daftar dengan Google
        </button>
      </form>

      <!-- Sign In Link -->
      <div class="auth-link">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Theme Toggle -->
  <button id="themeToggle" style="position: fixed; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.9); border: 1px solid #E5E7EB; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; z-index: 999; transition: all 0.3s ease;">🌙</button>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>
  
  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>

  <script>
    // Toggle Password Visibility
    document.getElementById('togglePassword').addEventListener('click', function(e) {
      e.preventDefault();
      const passwordInput = document.getElementById('password');
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      this.textContent = isPassword ? '🙈' : '👁️';
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function(e) {
      e.preventDefault();
      const passwordInput = document.getElementById('confirmPassword');
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      this.textContent = isPassword ? '🙈' : '👁️';
    });

    // Form Validation
    function validateForm(email, username, password, confirmPassword) {
      if (!username || username.length < 3) {
        showToast('Username minimal 3 karakter', 'error');
        return false;
      }

      if (!email || !email.includes('@')) {
        showToast('Email tidak valid', 'error');
        return false;
      }

      if (!password || password.length < 8) {
        showToast('Password minimal 8 karakter', 'error');
        return false;
      }

      if (password !== confirmPassword) {
        showToast('Password dan konfirmasi tidak sesuai', 'error');
        return false;
      }

      if (!document.getElementById('terms').checked) {
        showToast('Anda harus menyetujui Syarat & Ketentuan', 'error');
        return false;
      }

      return true;
    }

    // Form Submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Check if Firebase loaded
      if (typeof firebase === 'undefined' || typeof auth === 'undefined') {
        showToast('Firebase masih loading... tunggu sebentar', 'error');
        return;
      }
      
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!validateForm(email, username, password, confirmPassword)) {
        return;
      }

      // Show loading
      document.getElementById('registerBtn').disabled = true;
      document.getElementById('registerBtnText').style.display = 'none';
      document.getElementById('registerBtnSpinner').style.display = 'inline-block';

      try {
        // Check if signUp function exists
        if (typeof signUp !== 'function') {
          throw new Error('SignUp function tidak terdefinisi. Reload page!');
        }
        
        // Sign up
        await signUp(email, password, username);
        
        showToast('Akun berhasil dibuat!', 'success');
        
        setTimeout(() => {
          window.location.href = 'pages/dashboard.html';
        }, 500);
      } catch (error) {
        let errorMsg = error.message;
        
        if (error.code === 'auth/email-already-in-use') {
          errorMsg = 'Email sudah terdaftar';
        } else if (error.code === 'auth/weak-password') {
          errorMsg = 'Password terlalu lemah';
        } else if (error.code === 'auth/invalid-email') {
          errorMsg = 'Email tidak valid';
        }
        
        showToast(errorMsg, 'error');
        document.getElementById('registerBtn').disabled = false;
        document.getElementById('registerBtnText').style.display = 'inline';
        document.getElementById('registerBtnSpinner').style.display = 'none';
      }
    });

    // Google Register
    document.getElementById('googleRegisterBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      
      // Check if Firebase loaded
      if (typeof firebase === 'undefined' || typeof auth === 'undefined') {
        showToast('Firebase masih loading... tunggu sebentar', 'error');
        return;
      }
      
      document.getElementById('googleRegisterBtn').disabled = true;

      try {
        if (typeof loginWithGoogle !== 'function') {
          throw new Error('Google register function tidak terdefinisi');
        }
        
        const user = await loginWithGoogle();
        
        // Get user data
        await updateCurrentUserData();
        
        showToast('Akun Google berhasil terdaftar!', 'success');
        
        setTimeout(() => {
          window.location.href = 'pages/dashboard.html';
        }, 500);
      } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user') {
          showToast(error.message, 'error');
        }
        document.getElementById('googleRegisterBtn').disabled = false;
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Wait for Firebase to initialize
      let attempts = 0;
      const checkFirebase = setInterval(() => {
        if (typeof auth !== 'undefined' && auth !== null) {
          clearInterval(checkFirebase);
          
          const overlay = document.getElementById('loadingOverlay');
          if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => {
              overlay.style.pointerEvents = 'none';
            }, 300);
          }
        }
        attempts++;
        if (attempts > 50) { // 5 seconds timeout
          clearInterval(checkFirebase);
          console.warn('Firebase initialization timeout');
        }
      }, 100);
    });
  </script>
</body>
</html>
