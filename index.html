<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Store - Jual Beli Gmail Account Terpercaya</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animation.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230B5FFF' width='100' height='100' rx='20'/><text x='50' y='70' font-size='60' font-weight='bold' text-anchor='middle' fill='white'>G</text></svg>">
  
  <meta property="og:title" content="Gmail Store - Jual Beli Gmail Account">
  <meta property="og:description" content="Platform terpercaya untuk jual beli account Gmail. Dapatkan saldo dengan mudah.">
  <meta property="og:type" content="website">
</head>
<body class="light-mode">
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <p class="loading-text">Loading...</p>
    </div>
  </div>

  <!-- Landing Page Container -->
  <div class="auth-container">
    <div class="auth-card" style="animation-delay: 0.1s">
      <div class="auth-header">
        <div class="auth-logo">📧</div>
        <h1 class="auth-title">Gmail Store</h1>
        <p class="auth-subtitle">Jual beli account Gmail dengan aman dan terpercaya</p>
      </div>

      <div class="auth-form">
        <!-- Info Cards -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 2rem 0;">
          <div style="text-align: center; padding: 1rem; background: rgba(11, 95, 255, 0.05); border-radius: 12px; border: 1px solid rgba(11, 95, 255, 0.2);">
            <div style="font-size: 1.8rem; margin-bottom: 0.5rem;">💰</div>
            <div style="font-weight: 600; font-size: 0.9rem;">Dapatkan Saldo</div>
            <div style="font-size: 0.8rem; color: #6B7280; margin-top: 0.5rem;">Setor Gmail, dapatkan bayaran</div>
          </div>
          <div style="text-align: center; padding: 1rem; background: rgba(45, 212, 191, 0.05); border-radius: 12px; border: 1px solid rgba(45, 212, 191, 0.2);">
            <div style="font-size: 1.8rem; margin-bottom: 0.5rem;">🔒</div>
            <div style="font-weight: 600; font-size: 0.9rem;">100% Aman</div>
            <div style="font-size: 0.8rem; color: #6B7280; margin-top: 0.5rem;">Sistem keamanan terjamin</div>
          </div>
        </div>

        <!-- Features -->
        <div style="display: flex; flex-direction: column; gap: 0.8rem; margin: 2rem 0; font-size: 0.9rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="color: var(--success); font-size: 1.2rem;">✓</span>
            <span>Proses cepat dan mudah</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="color: var(--success); font-size: 1.2rem;">✓</span>
            <span>Minimal penarikan Rp. 50.000</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="color: var(--success); font-size: 1.2rem;">✓</span>
            <span>Support 24/7</span>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="color: var(--success); font-size: 1.2rem;">✓</span>
            <span>Harga Rp. 2.000 per Gmail</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem;">
          <button class="auth-button" onclick="location.href='register.html'" style="background: linear-gradient(135deg, var(--secondary) 0%, #10a570 100%);">
            📝 Daftar
          </button>
          <button class="auth-button" onclick="location.href='login.html'">
            🔑 Login
          </button>
        </div>

        <!-- Quick Access -->
        <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(0, 0, 0, 0.1);">
          <p style="font-size: 0.85rem; color: #6B7280; margin-bottom: 1rem;">Sudah punya akun?</p>
          <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Masuk sekarang →</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Theme Toggle (hidden for landing page, but initialized) -->
  <button id="themeToggle" style="position: fixed; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.9); border: 1px solid #E5E7EB; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; z-index: 999; transition: all 0.3s ease;">🌙</button>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>
  
  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>

  <script>
    // Hide loading after page loads
    window.addEventListener('load', () => {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.pointerEvents = 'none';
        }, 300);
      }
    });
  </script>
</body>
</html>
