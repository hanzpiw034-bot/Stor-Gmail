<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230B5FFF' width='100' height='100' rx='20'/><text x='50' y='70' font-size='60' font-weight='bold' text-anchor='middle' fill='white'>G</text></svg>">
</head>
<body class="light-mode">
  <div class="auth-container" style="min-height: 100vh;">
    <div class="auth-card">
      <div class="auth-header" style="text-align: center;">
        <div style="font-size: 5rem; margin-bottom: 1rem;">😕</div>
        <h1 class="auth-title">404</h1>
        <p class="auth-subtitle">Halaman tidak ditemukan</p>
      </div>

      <div class="auth-form">
        <p style="text-align: center; color: #6B7280; margin-bottom: 2rem;">
          Maaf, halaman yang Anda cari tidak ada atau sudah dihapus.
        </p>

        <button class="auth-button" onclick="location.href='/'">
          🏠 Kembali ke Beranda
        </button>

        <button class="auth-button" style="background: linear-gradient(135deg, var(--secondary) 0%, #10a570 100%); margin-top: 1rem;" onclick="location.href='/login.html'">
          🔑 Login
        </button>
      </div>
    </div>
  </div>

  <button id="themeToggle" style="position: fixed; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.9); border: 1px solid #E5E7EB; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; z-index: 999;">🌙</button>

  <script src="js/theme.js"></script>
</body>
</html>
